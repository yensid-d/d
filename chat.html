<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi STIs Test Kit</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Itim&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Itim', cursive; background-color: #f0f9ff; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between items-center pb-20">

    <header class="w-full max-w-lg bg-white border-b border-sky-100 p-4 shadow-sm text-center sticky top-0 z-10">
        <h1 class="text-xl font-bold text-sky-950">ระบบปรึกษาแพทย์ & คลินิก</h1>
        <p id="patientInfo" class="text-xs text-sky-600 mt-0.5">กำลังโหลดข้อมูล...</p>
    </header>

    <main class="w-full max-w-lg flex-1 p-4">
        <!-- Tab 1: Chat -->
        <div id="tabChatView" class="flex flex-col h-full space-y-4">
            <div id="chatMessages" class="flex-1 bg-white p-4 rounded-2xl border border-sky-100 min-h-[400px] max-h-[60vh] overflow-y-auto space-y-3 shadow-sm">
                <div class="text-center text-xs text-sky-400 my-2">กำลังโหลดประวัติการสนทนา...</div>
            </div>

            <form id="chatForm" class="flex gap-2">
                <input type="text" id="chatInput" placeholder="พิมพ์ข้อความของคุณที่นี่..." required
                       class="flex-1 p-3 bg-white border border-sky-100 rounded-xl text-sm focus:outline-none focus:border-sky-400 shadow-sm">
                <button type="submit" id="sendBtn" class="bg-sky-500 hover:bg-sky-600 text-white px-5 rounded-xl text-sm font-medium shadow-md transition cursor-pointer">
                    ส่ง
                </button>
            </form>
        </div>

        <!-- Tab 2: Clinics -->
        <div id="tabClinicView" class="hidden space-y-4">
            <div class="bg-white p-4 rounded-2xl border border-sky-100 shadow-sm">
                <h2 class="text-lg font-bold text-sky-950 mb-1">📍 คลินิกและสถานบริการใกล้ฉัน</h2>
                <p class="text-xs text-sky-600 mb-3">แนะนำสถานบริการสำหรับเข้ารับการตรวจและปรึกษาเพิ่มเติม</p>
                <div id="clinicList" class="space-y-3">
                    <p class="text-xs text-sky-400 text-center py-4">กำลังโหลดข้อมูลคลินิก...</p>
                </div>
            </div>
        </div>
    </main>

    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-sky-100 shadow-lg z-20 flex justify-center">
        <div class="w-full max-w-lg flex justify-around p-2">
            <button id="btnNavChat" onclick="switchTab('chat')" class="flex flex-col items-center gap-1 p-2 text-sky-500 font-medium cursor-pointer">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg>
                <span class="text-xs">ห้องแชต</span>
            </button>
            <button id="btnNavClinic" onclick="switchTab('clinic')" class="flex flex-col items-center gap-1 p-2 text-gray-400 font-medium hover:text-sky-500 transition cursor-pointer">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                <span class="text-xs">คลินิกใกล้ฉัน</span>
            </button>
        </div>
    </nav>

    <script>
        const SUPABASE_URL = "https://gsfwxrbeykupnobvnvvj.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_qpHFtNjXGKYTIXMXaT_NPw_BLIOv7oc";
        const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentPatientId = null;
        let currentChatHistory = [];
        let patientName = "";
        let patientSex = "";

        document.addEventListener('DOMContentLoaded', async () => {
            currentPatientId = localStorage.getItem('patient_record_id');

            if (!currentPatientId) {
                window.location.replace("./index.html");
                return;
            }

            await loadPatientProfile();
            await loadChatHistory();
            loadClinicsFromDB();
        });

        async function loadPatientProfile() {
            const { data } = await db
                .from('patient_records')
                .select('*')
                .eq('id', currentPatientId)
                .maybeSingle();

            if (data) {
                patientName = `${data.first_name} ${data.last_name}`;
                patientSex =  `${data.sex}`;
                document.getElementById('patientInfo').innerText = `คุณ : ${patientName}`;
            }
        }

        async function loadChatHistory() {
            const { data, error } = await db
                .from('consultations')
                .select('chat_history')
                .eq('id', currentPatientId)
                .maybeSingle();

            if (data && data.chat_history && Array.isArray(data.chat_history)) {
                currentChatHistory = data.chat_history;
            } else {
                currentChatHistory = [{
                    sender: 'doctor',
                    message: 'สวัสดีครับ ยินดีต้อนรับสู่บริการให้คำปรึกษา มีข้อสงสัยหรืออาการอย่างไร สามารถพิมพ์พูดคุยกับคุณหมอได้เลยครับ'
                }];
            }
            renderChatUI();
        }

        function renderChatUI() {
            const chatContainer = document.getElementById('chatMessages');
            chatContainer.innerHTML = '';

            currentChatHistory.forEach(msg => {
                if (msg.sender === 'patient') {
                    chatContainer.innerHTML += `
                        <div class="flex items-start justify-end gap-2">
                            <div class="bg-sky-500 text-white p-3 rounded-2xl rounded-tr-none text-sm max-w-[80%] shadow-sm">
                                ${msg.message}
                            </div>
                        </div>
                    `;
                } else {
                    chatContainer.innerHTML += `
                        <div class="flex items-start gap-2">
                            <div class="w-8 h-8 rounded-full bg-sky-500 text-white flex items-center justify-center text-xs font-bold shrink-0">หมอ</div>
                            <div class="bg-sky-50 text-sky-900 p-3 rounded-2xl rounded-tl-none text-sm max-w-[80%] border border-sky-100">
                                ${msg.message}
                            </div>
                        </div>
                    `;
                }
            });
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        document.getElementById('chatForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const input = document.getElementById('chatInput');
            const messageText = input.value.trim();
            if (!messageText) return;

            input.value = '';

            currentChatHistory.push({ sender: 'patient', message: messageText });
            renderChatUI();

            const { error } = await db
                .from('consultations')
                .upsert([{
                    id: currentPatientId,
                    name: patientName || 'ไม่ระบุ',
                    sex: patientSex || 'ไม่ระบุ',
                    chat_history: currentChatHistory,
                    updated_at: new Date().toISOString()
                }], { onConflict: 'id' });

            if (error) {
                console.error('Save chat error:', error.message);
                alert('ไม่สามารถบันทึกข้อความได้: ' + error.message);
            }
        });

        // ฟังก์ชันดึงข้อมูลคลินิกและรองรับฟิลด์ map_url / google_maps_url
        async function loadClinicsFromDB() {
            const clinicContainer = document.getElementById('clinicList');
            const { data, error } = await db
                .from('clinics')
                .select('*');

            if (error || !data || data.length === 0) {
                clinicContainer.innerHTML = `<p class="text-xs text-sky-400 text-center py-4">ไม่พบข้อมูลคลินิกในระบบ</p>`;
                return;
            }

            clinicContainer.innerHTML = data.map(clinic => {
                // รองรับชื่อฟิลด์ได้ทั้ง map_url หรือ google_maps_url
                const mapLink = clinic.map_url || clinic.google_maps_url;
                
                // รองรับการแสดงผลชื่อคลินิกและที่อยู่จากฟิลด์ต่างๆ (clinic_name หรือ name, จังหวัด/อำเภอ หรือ location)
                const nameText = clinic.clinic_name || clinic.name || 'ไม่ระบุชื่อคลินิก';
                const addressText = clinic.address || clinic.location || 'ไม่ระบุสถานที่';
                const phoneText = clinic.phone || clinic.contact || '-';

                const mapBtn = mapLink 
                    ? `<a href="${mapLink}" target="_blank" rel="noopener noreferrer" 
                           class="inline-flex items-center gap-1 text-xs text-sky-600 hover:text-sky-800 font-medium underline mt-2">
                            🗺️ นำทางด้วย Google Maps ↗
                       </a>`
                    : '';

                return `
                    <div class="p-3.5 bg-sky-50/60 rounded-xl border border-sky-100 hover:border-sky-300 transition shadow-sm">
                        <h3 class="font-bold text-sky-900 text-sm">${nameText}</h3>
                        <p class="text-xs text-sky-700 mt-1">📍 ${addressText}</p>
                        <p class="text-xs text-sky-600 mt-0.5">📞 ติดต่อ: ${phoneText}</p>
                        ${mapBtn}
                    </div>
                `;
            }).join('');
        }

        function switchTab(tab) {
            const chatView = document.getElementById('tabChatView');
            const clinicView = document.getElementById('tabClinicView');
            const btnChat = document.getElementById('btnNavChat');
            const btnClinic = document.getElementById('btnNavClinic');

            if (tab === 'chat') {
                chatView.classList.remove('hidden');
                clinicView.classList.add('hidden');
                btnChat.className = "flex flex-col items-center gap-1 p-2 text-sky-500 font-medium cursor-pointer";
                btnClinic.className = "flex flex-col items-center gap-1 p-2 text-gray-400 font-medium hover:text-sky-500 transition cursor-pointer";
            } else {
                chatView.classList.add('hidden');
                clinicView.classList.remove('hidden');
                btnClinic.className = "flex flex-col items-center gap-1 p-2 text-sky-500 font-medium cursor-pointer";
                btnChat.className = "flex flex-col items-center gap-1 p-2 text-gray-400 font-medium hover:text-sky-500 transition cursor-pointer";
            }
        }
    </script>
</body>
</html>
