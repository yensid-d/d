<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi STIs Test Kit</title>
    <!-- Google Font: Itim -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Itim&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { 
            font-family: 'Itim', cursive; 
            background-color: #fafafa;
            color: #18181b;
        }
    </style>
</head>
<body class="bg-zinc-50 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white p-6 sm:p-8 rounded-2xl shadow-sm border border-zinc-200 w-full max-w-md space-y-6">
        
        <div class="text-center space-y-1">
            <h1 class="text-2xl font-bold text-zinc-900">Multi STIs Test Kit</h1>
            <p class="text-xs text-zinc-500">กรุณากรอกข้อมูล</p>
        </div>

        <form id="patientForm" class="space-y-4">
            
            <!-- ช่องชื่อ-นามสกุล -->
            <div class="space-y-1">
                <label for="fullName" class="text-sm font-medium text-zinc-700">ชื่อ - นามสกุล</label>
                <input type="text" id="fullName" required placeholder="เช่น ภวินท์ ใจดี"
                       class="w-full p-2.5 bg-zinc-50 border border-zinc-200 rounded-xl text-sm focus:outline-none focus:border-zinc-800 transition">
            </div>

            <!-- 🌟 เพิ่ม Dropdown เลือกเพศ -->
            <div class="space-y-1">
                <label for="sex" class="text-sm font-medium text-zinc-700">เพศ / Sex</label>
                <select id="sex" required 
                        class="w-full p-2.5 bg-zinc-50 border border-zinc-200 rounded-xl text-sm focus:outline-none focus:border-zinc-800 transition cursor-pointer">
                    <option value="" disabled selected>-- เลือกเพศ / Sex --</option>
                    <option value="ชาย">ชาย / Male</option>
                    <option value="หญิง">หญิง / Female</option>
                </select>
            </div>

            <!-- ช่องผลตรวจ/สถานะ -->
            <div class="space-y-1">
                <label for="testResult" class="text-sm font-medium text-zinc-700">ผลการตรวจเบื้องต้น</label>
                <select id="testResult" required 
                        class="w-full p-2.5 bg-zinc-50 border border-zinc-200 rounded-xl text-sm focus:outline-none focus:border-zinc-800 transition cursor-pointer">
                    <option value="" disabled selected>-- เลือกผลตรวจ / Test results --</option>
                    <option value="positive">ผลเป็นบวก / positive</option>
                    <option value="negative">ผลเป็นลบ / negative</option>
                </select>
            </div>

            <button type="submit" 
                    class="w-full bg-zinc-900 hover:bg-zinc-800 text-white p-3 rounded-xl text-sm font-medium transition cursor-pointer shadow-sm mt-2">
                ส่งข้อมูล / Submit information →
            </button>
        </form>

    </div>

    <script>
        const SUPABASE_URL = "https://gsfwxrbeykupnobvnvvj.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_qpHFtNjXGKYTIXMXaT_NPw_BLIOv7oc";
        const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        document.getElementById('patientForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const fullName = document.getElementById('fullName').value.trim();
            const gender = document.getElementById('gender').value;
            const testResult = document.getElementById('testResult').value;

            // บันทึกข้อมูลลง localStore เพื่อนำไปใช้ต่อในหน้า chat.html
            localStorage.setItem('patient_chat_name', fullName);
            localStorage.setItem('patient_gender', gender);
            localStorage.setItem('patient_test_result', testResult);

            // บันทึกประวัติเข้าตาราง patient_records ใน Supabase
            const { error } = await db
                .from('patient_records')
                .insert([{ 
                    name: fullName, 
                    gender: gender, 
                    test_result: testResult 
                }]);

            if (error) {
                console.warn("แจ้งเตือนบันทึกตาราง patient_records:", error.message);
            }

            // นำทางไปยังหน้าแชท
            window.location.href = 'chat.html';
        });
    </script>
</body>
</html>
